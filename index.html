<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veritas — Context &amp; Verification Research</title>
    <meta name="description" content="A clean, modern context and verification research tool for text, images, URLs, and voice inputs." />
    <meta property="og:title" content="Veritas — Context &amp; Verification Research" />
    <meta property="og:description" content="A clean, modern context and verification research tool for text, images, URLs, and voice inputs." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Pre-hydration Theme Script to prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('veritas_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Refined Typography: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
